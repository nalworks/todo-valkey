apiVersion: agent.opspresso.com/v3
kind: Application
spec:
  name: todo-valkey
  owner: dBT43yQ7DQIIIMlYbjiXsIr8tbuIgVJA
  repository: nalworks/todo-valkey
  description: Node.js todo app backed by Valkey
runtime:
  type: k8s
  port: 8080
  health: /health
pipeline:
  trigger:
    branch: main
  build:
    context: .
    dockerfile: Dockerfile
  test:
    image: node:24-alpine
    command: npm ci && npm test
# Promotion order: a push to main deploys to dev; prod receives a Release only by promotion.
environments:
  - name: dev
    size: small
    env:
      LOG_LEVEL: info
    resources:
      - name: todo-valkey
        template: valkey
  - name: prod
    size: small
    resources:
      - name: todo-valkey
        template: valkey
